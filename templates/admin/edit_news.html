<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit News - Bhartiya Patrakar Union</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #0b1f3a;
            color: white;
            text-align: center;
            padding: 25px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.10);
        }

        h2 {
            color: #0b1f3a;
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        .current-image {
            width: 220px;
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
            display: block;
        }

        .no-image {
            color: #777;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .note {
            color: #777;
            font-size: 13px;
            margin-top: 7px;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .update-btn {
            background: #0b1f3a;
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .back-btn {
            background: #777;
            color: white;
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 7px;
        }

        .update-btn:hover {
            background: #163b6d;
        }

        .back-btn:hover {
            background: #555;
        }

        @media (max-width: 600px) {

            .container {
                width: 95%;
                padding: 22px;
                margin: 25px auto;
            }

            .buttons {
                flex-direction: column;
            }

            .update-btn,
            .back-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>Bhartiya Patrakar Union</h1>

        <p>Edit News Article</p>

    </div>


    <div class="container">

        <h2>Edit News</h2>


        <form method="POST"
              enctype="multipart/form-data">


            <label for="title">
                News Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ news['title'] }}"
                required
            >


            <label for="category">
                Category
            </label>

            <select
                id="category"
                name="category"
                required
            >

                <option value="Union Update"
                    {% if news['category'] == 'Union Update' %}
                    selected
                    {% endif %}>
                    Union Update
                </option>

                <option value="Press Release"
                    {% if news['category'] == 'Press Release' %}
                    selected
                    {% endif %}>
                    Press Release
                </option>

                <option value="News"
                    {% if news['category'] == 'News' %}
                    selected
                    {% endif %}>
                    News
                </option>

                <option value="Events"
                    {% if news['category'] == 'Events' %}
                    selected
                    {% endif %}>
                    Events
                </option>

                <option value="Announcement"
                    {% if news['category'] == 'Announcement' %}
                    selected
                    {% endif %}>
                    Announcement
                </option>

            </select>


            <label for="content">
                News Content
            </label>

            <textarea
                id="content"
                name="content"
                required
            >{{ news['content'] }}</textarea>


            <label>
                Current News Image
            </label>

            {% if news['image'] %}

                <img
                    src="{{ url_for('static', filename='uploads/' + news['image']) }}"
                    alt="Current News Image"
                    class="current-image"
                >

            {% else %}

                <div class="no-image">
                    No image uploaded.
                </div>

            {% endif %}


            <label for="image">
                Change News Image
            </label>

            <input
                type="file"
                id="image"
                name="image"
                accept=".jpg,.jpeg,.png,.webp"
            >

            <div class="note">
                Leave this empty if you want to keep the current image.
            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="update-btn"
                >
                    💾 Update News
                </button>

                <a
                    href="/admin"
                    class="back-btn"
                >
                    ← Back to Dashboard
                </a>

            </div>

        </form>

    </div>

</body>

</html>
