<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Gallery Photo - Bhartiya Patrakar Union</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 18px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input[type="file"] {
            background: #f9fafb;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }

        .note {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
                padding: 0 12px;
            }

            .card {
                padding: 20px;
            }

            header {
                padding: 16px;
            }

            header h1 {
                font-size: 20px;
            }
        }
    </style>

</head>

<body>

    <header>
        <h1>Bhartiya Patrakar Union</h1>
    </header>

    <div class="container">

        <div class="card">

            <h2>🖼️ Add Gallery Photo</h2>

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                <label for="title">
                    Photo Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter photo title"
                    required
                >

                <label for="image">
                    Select Photo
                </label>

                <input
                    type="file"
                    id="image"
                    name="image"
                    accept=".jpg,.jpeg,.png,.webp"
                    required
                >

                <p class="note">
                    Supported formats: JPG, JPEG, PNG, WEBP
                </p>

                <button type="submit">
                    Upload Photo
                </button>

            </form>

            <a href="/admin" class="back">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
