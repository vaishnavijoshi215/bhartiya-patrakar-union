<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Success - Bhartiya Patrakar Union</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f3f6fa;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .success-card {

            width: 100%;

            max-width: 520px;

            background: white;

            padding: 45px 30px;

            border-radius: 16px;

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.10);
        }


        .success-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #dcfce7;

            color: #16a34a;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

            font-weight: bold;
        }


        h1 {

            margin: 0 0 12px;

            color: #0f2747;

            font-size: 28px;
        }


        p {

            color: #64748b;

            line-height: 1.7;

            margin-bottom: 28px;
        }


        .home-btn {

            display: inline-block;

            background: #0f2747;

            color: white;

            text-decoration: none;

            padding: 12px 24px;

            border-radius: 7px;

            font-size: 15px;

            transition: 0.3s;
        }


        .home-btn:hover {

            background: #1d4ed8;

            transform: translateY(-2px);
        }


        @media (max-width: 500px) {

            .success-card {

                padding: 35px 20px;
            }


            h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="success-card">


        <div class="success-icon">

            ✓

        </div>


        <h1>

            {{ title }}

        </h1>


        <p>

            {{ message }}

        </p>


        <a
            href="{{ url_for('home') }}"
            class="home-btn"
        >

            Back to Home

        </a>


    </div>


</body>

</html>
